<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7</title>
</head>

<body>
    <h2>this is dom</h2>
    <div id="dataShowing">

    </div>

    <script>
        const show = document.getElementById("dataShowing")
        const running = async () => {

            try {


                const getData = await fetch("https://dummyjson.com/products/1")
                if (!getData.ok) {
                    throw new Error("htpp" + getData.status)
                    return
                }
                const changeData = await getData.json()
                let user=changeData
               

                let myData =
                `
               <p>title${user.title}</p>
                 <p>price${user.price}</p>
                
                   <p>category${user.category}</p>
              
            `
                
                show.innerHTML=myData

            }catch(e){
                console.log(e)

            }finally{
                console.log("ok done")
            }
    }
      running()
    </script>
</body>

</html>
