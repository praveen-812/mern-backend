<body>
    <h2>palindrome number check</h2>

    <script>
        const nums ="121"
        let reverse=""
        for (a=0;a<nums.length;a++){
            reverse =nums[a]+reverse

        }
        console.log(reverse)
        if(nums==reverse){
            console.log("palindrome")

        }else(
            console.log("not palindrome")
        )

        
    </script>
</body>
